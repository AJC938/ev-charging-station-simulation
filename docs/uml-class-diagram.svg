<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920"><rect width="1500" height="920" fill="#f7fafb"/><text x="750" y="52" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#102e3a">EV Charging Station — Object-Oriented Architecture</text><g font-family="Arial" font-size="16"><rect x="560" y="90" width="380" height="150" rx="14" fill="#eaf7f1" stroke="#18c37e" stroke-width="3"/><text x="750" y="120" text-anchor="middle" font-weight="700" font-size="22" fill="#102e3a">&lt;&lt;abstract&gt;&gt; Vehicle</text><text x="585" y="153" fill="#31515c">battery state · arrival · patience</text><text x="585" y="180" fill="#31515c">reservation · waiting · priority</text><text x="585" y="207" fill="#31515c">deepCopy() · shallowCopy()</text><rect x="70" y="310" width="260" height="130" rx="14" fill="white" stroke="#a8c1c9"/><text x="200" y="342" text-anchor="middle" font-weight="700" font-size="20" fill="#17313b">PrivateCar</text><text x="90" y="375" fill="#526b74">priority = 1</text><text x="90" y="402" fill="#526b74">60 kWh battery</text><rect x="360" y="310" width="260" height="130" rx="14" fill="white" stroke="#a8c1c9"/><text x="490" y="342" text-anchor="middle" font-weight="700" font-size="20" fill="#17313b">Taxi</text><text x="380" y="375" fill="#526b74">priority = 1</text><text x="380" y="402" fill="#526b74">55 kWh battery</text><rect x="640" y="310" width="260" height="130" rx="14" fill="white" stroke="#a8c1c9"/><text x="770" y="342" text-anchor="middle" font-weight="700" font-size="20" fill="#17313b">Ambulance</text><text x="660" y="375" fill="#526b74">priority = 5</text><text x="660" y="402" fill="#526b74">emergency vehicle</text><rect x="920" y="310" width="260" height="130" rx="14" fill="white" stroke="#a8c1c9"/><text x="1050" y="342" text-anchor="middle" font-weight="700" font-size="20" fill="#17313b">ElectricBus</text><text x="940" y="375" fill="#526b74">priority = 2</text><text x="940" y="402" fill="#526b74">250 kWh battery</text><rect x="1210" y="310" width="220" height="130" rx="14" fill="white" stroke="#a8c1c9"/><text x="1320" y="342" text-anchor="middle" font-weight="700" font-size="20" fill="#17313b">Other Vehicles</text><text x="1230" y="375" fill="#526b74">DeliveryVan</text><text x="1230" y="402" fill="#526b74">Police / Highlander</text><path d="M750 240 V275 H200 V310 M750 275 H490 V310 M750 275 V310 M750 275 H1050 V310 M750 275 H1320 V310" fill="none" stroke="#55757f" stroke-width="2"/><rect x="80" y="560" width="340" height="160" rx="14" fill="#eef7f2" stroke="#18c37e" stroke-width="2"/><text x="250" y="595" text-anchor="middle" font-weight="700" font-size="21" fill="#102e3a">&lt;&lt;abstract&gt;&gt; Charger</text><text x="105" y="630" fill="#526b74">maxPowerOutput · occupied</text><text x="105" y="657" fill="#526b74">canCharge(vehicle)</text><text x="105" y="684" fill="#526b74">start / charge / release</text><rect x="500" y="560" width="220" height="120" rx="14" fill="white" stroke="#a8c1c9"/><text x="610" y="598" text-anchor="middle" font-weight="700" font-size="19" fill="#17313b">StandardCharger</text><text x="520" y="630" fill="#526b74">22 kW</text><rect x="760" y="560" width="220" height="120" rx="14" fill="white" stroke="#a8c1c9"/><text x="870" y="598" text-anchor="middle" font-weight="700" font-size="19" fill="#17313b">FastCharger</text><text x="780" y="630" fill="#526b74">70 kW</text><rect x="1020" y="560" width="220" height="120" rx="14" fill="white" stroke="#a8c1c9"/><text x="1130" y="598" text-anchor="middle" font-weight="700" font-size="19" fill="#17313b">SuperCharger</text><text x="1040" y="630" fill="#526b74">150 kW</text><path d="M250 720 V760 H610 V680 M610 760 H870 V680 M610 760 H1130 V680" fill="none" stroke="#55757f" stroke-width="2"/><rect x="80" y="790" width="360" height="90" rx="14" fill="#102e3a"/><text x="260" y="825" text-anchor="middle" font-weight="700" font-size="20" fill="white">ChargingStation</text><text x="100" y="853" fill="#a9c2cb">queue · reservations · dispatch · power</text><rect x="520" y="790" width="360" height="90" rx="14" fill="#102e3a"/><text x="700" y="825" text-anchor="middle" font-weight="700" font-size="20" fill="white">ReservationSystem</text><text x="540" y="853" fill="#a9c2cb">vehicle ID → reserved slot</text><rect x="960" y="790" width="360" height="90" rx="14" fill="#102e3a"/><text x="1140" y="825" text-anchor="middle" font-weight="700" font-size="20" fill="white">SimulationGUI</text><text x="980" y="853" fill="#a9c2cb">Swing dashboard + simulation clock</text></g></svg>