name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile source and tests
        run: |
          mkdir -p build/classes
          javac -d build/classes $(find src tests -name '*.java')
      - name: Run tests
        run: java -cp build/classes tests.DSATest
      - name: Smoke test console simulation
        run: java -cp build/classes evcharging.Main 3642034 > build/simulation-report.txt
